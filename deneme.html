<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>TradingView bağlantı denemesi</title>
<style>
  :root { color-scheme: dark light; }
  body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: #0e1116; color: #e6e9ef; }
  main { width: min(94vw, 480px); margin: 0 auto; padding: 20px 12px 40px; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { color: #9aa4b2; font-size: 14px; line-height: 1.45; margin: 0 0 16px; }
  a { display: block; padding: 14px; border-radius: 10px; margin-bottom: 10px; text-decoration: none; background: #1a2030; color: #e6e9ef; border: 1px solid #2f3742; }
  a b { color: #6ea8ff; font-size: 17px; }
  a span { display: block; color: #8a94a3; font-size: 11px; margin-top: 4px; word-break: break-all; font-family: ui-monospace, Menlo, monospace; }
  @media (prefers-color-scheme: light) { body { background: #f6f7f9; color: #14171c; } a { background: #fff; color: #14171c; border-color: #cfd6de; } p { color: #5b6573; } }
</style>
</head>
<body>
<main>
  <h1>Hangisi SOL grafiğini açıyor?</h1>
  <p>Her düğme TradingView uygulamasını farklı bir adres biçimiyle açmayı dener. Sırayla dokun; uygulama <b>SOLUSDT.P</b> (Binance vadeli) grafiğini açarsa o düğmenin numarasını söyle. Uygulama açılıp başka coin gösterirse ya da hiç açılmazsa sıradakine geç.</p>
  <div id="l"></div>
</main>
<script>
  var S = 'BINANCE:SOLUSDT.P', E = encodeURIComponent(S);
  var L = [
    'tradingview://chart?symbol=' + S,
    'tradingview://chart?symbol=' + E,
    'tradingview://chart/?symbol=' + S,
    'tradingview://symbol?symbol=' + S,
    'tradingview://symbol/' + S,
    'tradingview://symbols/SOLUSDT.P/?exchange=BINANCE',
    'tradingview://www.tradingview.com/chart/?symbol=' + S,
    'tradingview://chart?symbol=SOLUSDT.P&exchange=BINANCE',
    'tradingview://open?symbol=' + S,
    'tradingview://chart?ticker=' + S,
    'tradingview://chart/' + S,
    'tradingview://x-callback-url/chart?symbol=' + S,
    'https://www.tradingview.com/chart/?symbol=' + S,
    'https://www.tradingview.com/symbols/SOLUSDT.P/?exchange=BINANCE',
    'https://tr.tradingview.com/chart/?symbol=' + S
  ];
  document.getElementById('l').innerHTML = L.map(function (u, i) {
    return '<a href="' + u.replace(/"/g, '&quot;') + '"><b>' + (i + 1) + '</b><span>' + u + '</span></a>';
  }).join('');
</script>
</body>
</html>
