<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>TradingView</title>
<script>
  // Eski mesajlardaki bağlantılar için: hiç beklemeden, düğmesiz, doğrudan TradingView'in o coine ait grafik sayfasına gider.
  (function () {
    var s = (new URLSearchParams(location.search).get('s') || '').toUpperCase();
    var u = 'https://www.tradingview.com/chart/';
    if (/^[A-Z0-9]{1,15}:[A-Z0-9._!]{1,30}$/.test(s)) u += '?symbol=' + encodeURIComponent(s).replace(/%3A/g, ':');
    location.replace(u);
  })();
</script>
<noscript><meta http-equiv="refresh" content="0;url=https://www.tradingview.com/chart/"></noscript>
</head>
<body></body>
</html>
